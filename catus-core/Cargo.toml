[package]
name = "catus-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
diff-match-patch-rs = "0.5.1"
dirs = "6.0.0"
catus-rag = { path = "../catus-rag" }
eventsource-stream = "0.2.3"
flate2 = "1"
futures = "0.3.34"
http = "1"
reqwest = { version = "0.13.4", features = ["json", "stream", "cookies"] }
rmcp = { version = "3.1.4", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.2.0"
serde_json = "1.0.151"
sutcac-sh = { path = "../sutcac-sh" }
tar = "0.4"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "chrono", "tracing-log"] }

[dev-dependencies]
tempfile = "3"
