[package]
name = "catus"
version = "0.1.0"
edition = "2024"

[dependencies]
catus-core = { path = "../catus-core" }
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3"
