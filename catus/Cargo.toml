[package]
name = "catus"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
crossterm = "0.29.0"
dirs = "6.0.0"
eventsource-stream = "0.2.3"
futures = "0.3.34"
log = "0.4"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.4", features = ["json", "stream", "cookies"] }
rmcp = { version = "3.1.4", features = ["client", "transport-child-process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.2.0"
serde_json = "1.0.151"
simplelog = "0.12"
sutcac-sh = { path = "../sutcac-sh" }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
unicode-width = "0.2.2"
