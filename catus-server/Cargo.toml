[package]
name = "catus-server"
version = "0.1.0"
description = "axum-based HTTP/WebSocket server frontend for catus-core with an embedded Vue UI"
authors = ["undatus63"]
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
rust-embed = "8"
mime_guess = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
catus-core = { path = "../catus-core" }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
